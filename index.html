    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px 16px 24px;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(26,20,16,0.3) 0%, rgba(26,20,16,0.7) 60%, rgba(26,20,16,0.95) 100%);
  }
  .hero-content {
    position: relative;
    z-index: 1;
    text-align: center;
  }
  .hero .brand-tag {
    display: inline-block;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #FFF;
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .hero h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 4px;
    margin-bottom: 4px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    background: linear-gradient(135deg, #FFF 0%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero .slogan {
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 3px;
    margin-bottom: 8px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }
  .hero .today-badge {
    display: inline-block;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    color: var(--text-dim);
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* Main Container */
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 12px 24px;
    position: relative;
    top: -12px;
    z-index: 2;
  }

  /* Section base */
  .section {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    border: 1px solid var(--border-light);
  }
  .section-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .section-title .icon {
    font-size: 18px;
  }
  .section-title .accent-bar {
    width: 3px;
    height: 18px;
    background: linear-gradient(180deg, var(--primary-light), var(--primary));
    border-radius: 3px;
  }

  /* Calendar - Month View */
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-nav-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-card-light);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    user-select: none;
  }
  .cal-nav-btn:active { background: var(--primary); border-color: var(--primary); }
  .cal-nav-btn:disabled { opacity: 0.3; pointer-events: none; }
  .cal-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 1px;
  }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 4px;
  }
  .cal-weekday {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding: 4px 0;
    font-weight: 600;
  }
  .cal-weekday.weekend { color: var(--primary-light); }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .cal-day {
    aspect-ratio: 1;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 1.5px solid transparent;
    background: var(--bg-card-light);
    transition: all 0.2s;
    user-select: none;
    position: relative;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    min-height: 42px;
  }
  .cal-day:active { transform: scale(0.92); }
  .cal-day.empty {
    background: transparent;
    border: none;
    pointer-events: none;
  }
  .cal-day.today {
    border-color: var(--gold);
    color: var(--gold);
  }
  .cal-day.selected {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #FFF;
    border-color: var(--primary-light);
    box-shadow: 0 3px 12px rgba(247,127,0,0.35);
  }
  .cal-day.past {
    opacity: 0.5;
  }
  .cal-day.rest {
    background: rgba(230,57,70,0.12);
    border-color: rgba(230,57,70,0.3);
    color: var(--danger);
  }
  .cal-day.rest .rest-label {
    font-size: 9px;
    font-weight: 600;
    margin-top: 1px;
  }
  .cal-day .day-badge {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    display: none;
  }
  .cal-day.has-orders .day-badge { display: block; }
  .cal-day.selected .day-badge { background: #FFF; }
  .cal-day.boss-rest-toggle {
    cursor: pointer !important;
    pointer-events: auto !important;
  }
  .cal-day.boss-rest-toggle.rest {
    pointer-events: auto !important;
  }
  .cal-day.tomorrow {
    border-color: var(--success);
    background: rgba(6,167,125,0.15);
  }
  .cal-day.tomorrow .tomorrow-label {
    font-size: 8px;
    font-weight: 700;
    color: var(--success);
    margin-top: 1px;
    letter-spacing: 1px;
  }
  .cal-day.locked {
    opacity: 0.5;
  }
  .cal-day.tomorrow.selected .tomorrow-label {
    color: #FFF;
  }

  /* Boss Mode Bar */
  .boss-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: rgba(247,127,0,0.1);
    border: 1px solid rgba(247,127,0,0.25);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    gap: 8px;
  }
  .boss-bar .boss-label {
    font-size: 13px;
    color: var(--gold);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .boss-toggle {
    position: relative;
    width: 44px;
    height: 24px;
    border-radius: 12px;
    background: var(--bg-card-light);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.25s;
    flex-shrink: 0;
  }
  .boss-toggle.on {
    background: var(--primary);
    border-color: var(--primary-light);
  }
  .boss-toggle .toggle-knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #FFF;
    transition: all 0.25s;
  }
  .boss-toggle.on .toggle-knob { left: 22px; }
  .boss-hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    line-height: 1.4;
    display: none;
  }
  .boss-hint.show { display: block; }

  /* Selected Date Info */
  .date-info-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .date-info-bar .date-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--gold);
  }
  .date-info-bar .guest-count {
    font-size: 13px;
    color: var(--text-dim);
    background: var(--bg-card-light);
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }
  .date-info-bar .guest-count strong {
    color: var(--primary-light);
    font-size: 18px;
  }

  /* Menu Section */
  .menu-section {
    background: var(--bg-card);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    border: 1px solid var(--border-light);
  }

  var $orderForm = document.getElementById('orderForm');
  var $btnSubmit = document.getElementById('btnSubmit');
  var $toastContainer = document.getElementById('toastContainer');
  var $loadingOverlay = document.getElementById('loadingOverlay');
  var $todayBadge = document.getElementById('todayBadge');

  // ============ Helpers ============
  function fmtDate(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    return (d.getMonth()+1) + '月' + d.getDate() + '日';
  }
  function getDayName(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  }
  function getTodayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function getTomorrowStr() {
    var d = new Date();
    d.setDate(d.getDate() + 1);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function getDateStr(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function showToast(msg, type) {
    type = type || 'info';
    var t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    $toastContainer.appendChild(t);
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2600);
  }
  function showLoading(){ $loadingOverlay.classList.add('show'); }
  function hideLoading(){ $loadingOverlay.classList.remove('show'); }
  function escapeHTML(s){ var d=document.createElement('div'); d.appendChild(document.createTextNode(s||'')); return d.innerHTML; }

  // ============ GitHub API Init ============
  function initGitHub() {
    if (!GH_TOKEN || !GH_OWNER || !GH_REPO) {
      document.getElementById('configWarning').classList.add('show');
      return false;
    }
    ghReady = true;
    return true;
  }

  // ============ GitHub API Helpers ============
  var GH_API = 'https://api.github.com';

  function ghHeaders() {
    return {
      'Authorization': 'Bearer ' + GH_TOKEN,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }

  // Read a JSON file from the repo
  async function ghReadFile(path) {
    var resp = await fetch(GH_API + '/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + path + '?ref=' + GH_BRANCH, {
      headers: ghHeaders()
    });
    if (resp.status === 404) return { data: null, sha: null };
    if (!resp.ok) throw new Error('读取失败: ' + resp.status);
    var result = await resp.json();
    var content = null;
    if (result.content) {
      // Decode base64 with UTF-8 support
      var decoded = decodeURIComponent(escape(atob(result.content.replace(/\n/g, ''))));
      try { content = JSON.parse(decoded); } catch(e) { content = null; }
    }
    return { data: content, sha: result.sha };
  }

  // Write a JSON file to the repo
  async function ghWriteFile(path, data, sha, message) {
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    var body = {
      message: message || 'update ' + path,
      content: content,
      branch: GH_BRANCH
    };
    if (sha) body.sha = sha;
    var resp = await fetch(GH_API + '/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + path, {
      method: 'PUT',
      headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!resp.ok) {
      var err = await resp.json().catch(function(){ return {}; });
      throw new Error(err.message || '写入失败: ' + resp.status);
    }
    var result = await resp.json();
    return result.content ? result.content.sha : null;
  }

  // ============ API (GitHub) ============
  async function apiGetOrders() {
    var result = await ghReadFile('data/orders.json');
    ordersSha = result.sha;
    return result.data || [];
  }
  async function apiAddOrder(order) {
    var newOrder = {
      id: 'ord_' + Date.now() + '_' + Math.floor(Math.random()*1000),
      date: order.date,
      name: order.name,
      contact: order.contact,
      items: order.items,
      notes: order.notes || '',
      createdAt: new Date().toISOString()
    };
    // Retry loop: re-read latest data on conflict
    for (var attempt = 0; attempt < 3; attempt++) {
      var result = await ghReadFile('data/orders.json');
      var orders = result.data || [];
      orders.push(newOrder);
      try {
        ordersSha = await ghWriteFile('data/orders.json', orders, result.sha, '新预订: ' + order.name + ' ' + order.date);
        return { success: true };
      } catch(e) {
        if (attempt < 2) { await new Promise(function(r){ setTimeout(r, 500); }); continue; }
        throw e;
      }
    }
    return { success: false };
  }
  async function apiDeleteOrder(id) {
    // Retry loop: re-read latest data on conflict
    for (var attempt = 0; attempt < 3; attempt++) {
      var result = await ghReadFile('data/orders.json');
      var orders = result.data || [];
      orders = orders.filter(function(o) { return String(o.id) !== String(id); });
      try {
        ordersSha = await ghWriteFile('data/orders.json', orders, result.sha, '删除预订 ' + id);
        return { success: true };
      } catch(e) {
        if (attempt < 2) { await new Promise(function(r){ setTimeout(r, 500); }); continue; }
        throw e;
      }
    }
    return { success: false };
  }
  async function apiGetRestDays() {
    var result = await ghReadFile('data/rest-days.json');
    restDaysSha = result.sha;
    return result.data || [];
  }
  async function apiSetRestDay(date) {
    var result = await ghReadFile('data/rest-days.json');
    var days = result.data || [];
    if (days.indexOf(date) === -1) {
      days.push(date);
      days.sort();
      restDaysSha = await ghWriteFile('data/rest-days.json', days, result.sha, '设置休息日: ' + date);
    }
    return { success: true };
  }
  async function apiRemoveRestDay(date) {
    var result = await ghReadFile('data/rest-days.json');
    var days = result.data || [];
    days = days.filter(function(d) { return d !== date; });
    restDaysSha = await ghWriteFile('data/rest-days.json', days, result.sha, '取消休息日: ' + date);
    return { success: true };
  }

  // ============ Load ============
  async function loadAll() {
    try {
      var [orders, rests] = await Promise.all([apiGetOrders(), apiGetRestDays()]);
      allOrders = orders;
      restDays = rests;
    } catch(e) {
      allOrders = []; restDays = [];
      console.warn('后端未连接');
    }
    renderAll();
  }

  // ============ Render Menu Display ============
  function renderMenuTable() {
    var html = '';
    for(var i=0; i<MENU.length; i++) {
      var m = MENU[i];
      html += '<div class="menu-row">';
      html += '<span class="menu-emoji">' + m.emoji + '</span>';
      html += '<span class="menu-name">' + m.name + '<span class="menu-unit">/ ' + m.unit + '</span></span>';
      html += '<span class="menu-price"><span class="yen">¥</span>' + m.price + '</span>';
      html += '</div>';
    }
    $menuTable.innerHTML = html;
  }

  // ============ Render Item Picker ============
  function renderItemPicker() {
    var html = '';
    for(var i=0; i<MENU.length; i++) {
      var m = MENU[i];
      var qty = itemQuantities[m.name] || 0;
      html += '<div class="item-row">';
      html += '<span class="item-name">' + m.emoji + ' ' + m.name + '</span>';
      html += '<span class="item-price-small">¥' + m.price + '/' + m.unit + '</span>';
      html += '<div class="qty-control">';
      html += '<button type="button" class="qty-btn minus" onclick="window._changeQty(\'' + m.name + '\',-1)">−</button>';
      html += '<span class="qty-display ' + (qty===0?'zero':'') + '" id="qty_' + m.name + '">' + qty + '</span>';
      html += '<button type="button" class="qty-btn plus" onclick="window._changeQty(\'' + m.name + '\',1)">+</button>';
      html += '</div>';
      html += '</div>';
    }
    $itemPicker.innerHTML = html;
  }

  function changeQty(name, delta) {
    var cur = itemQuantities[name] || 0;
    var next = Math.max(0, cur + delta);
    if(next > 99) next = 99;
    itemQuantities[name] = next;
    var el = document.getElementById('qty_' + name);
    if(el) {
      el.textContent = next;
      el.className = 'qty-display ' + (next===0?'zero':'');
    }
    updateTotal();
  }

  function updateTotal() {
    var total = 0;
    for(var i=0; i<MENU.length; i++) {
      var m = MENU[i];
      var qty = itemQuantities[m.name] || 0;
      if(qty > 0) total += qty * m.price;
    }
    $totalAmount.textContent = total;
  }

  function getSelectedItems() {
    var items = [];
    for(var i=0; i<MENU.length; i++) {
      var m = MENU[i];
      var qty = itemQuantities[m.name] || 0;
      if(qty > 0) items.push({ name: m.name, price: m.price, unit: m.unit, qty: qty });
    }
    return items;
  }

  function calcOrderTotal(items) {
    var total = 0;
    for(var i=0; i<items.length; i++) total += items[i].price * items[i].qty;
    return total;
  }

  // ============ Render Calendar (Month View) ============
  function renderWeekdays() {
    var names = ['日','一','二','三','四','五','六'];
    var html = '';
    for(var i=0; i<7; i++) {
      var cls = 'cal-weekday';
      if(i===0 || i===6) cls += ' weekend';
      html += '<div class="' + cls + '">' + names[i] + '</div>';
    }
    $calWeekdays.innerHTML = html;
  }

  function renderCalendar() {
    var todayStr = getTodayStr();
    var tomorrowStr = getTomorrowStr();
    var firstDay = new Date(calYear, calMonth, 1);
    var lastDay = new Date(calYear, calMonth + 1, 0);
    var startWeekday = firstDay.getDay();
    var daysInMonth = lastDay.getDate();

    var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    $calTitle.textContent = calYear + '年 ' + monthNames[calMonth];

    var html = '';
    // Empty cells before the 1st
    for(var i=0; i<startWeekday; i++) {
      html += '<div class="cal-day empty"></div>';
    }

    for(var d=1; d<=daysInMonth; d++) {
      var dateObj = new Date(calYear, calMonth, d);
      var dateStr = getDateStr(dateObj);
      var isToday = dateStr === todayStr;
      var isTomorrow = dateStr === tomorrowStr;
      var isPast = dateStr < todayStr;
      var isSelected = selectedDate === dateStr;
      var hasOrders = allOrders.some(function(o){ return o.date === dateStr; });
      var isRest = restDays.indexOf(dateStr) !== -1;

      var cls = 'cal-day';
      if(isToday) cls += ' today';
      if(isTomorrow) cls += ' tomorrow';
      if(isSelected) cls += ' selected';
      if(isPast) cls += ' past';
      if(isRest) cls += ' rest';
      if(hasOrders) cls += ' has-orders';

      var onclickStr = '';
      if(bossMode && !isPast) {
        cls += ' boss-rest-toggle';
        onclickStr = ' onclick="window._toggleRest(\'' + dateStr + '\')"';
      } else if(isTomorrow && !isRest) {
        onclickStr = ' onclick="window._selectDate(\'' + dateStr + '\')"';
      } else {
        // 所有其他日期也可点击查看（过去日期、今天、休息日、未来非次日）
        onclickStr = ' onclick="window._selectDate(\'' + dateStr + '\')"';
        if(!isPast && !isRest && !isToday) cls += ' locked';
      }

      html += '<div class="' + cls + '"' + onclickStr + '>';
      html += '<span>' + d + '</span>';
      if(isRest) html += '<span class="rest-label">休</span>';
      else if(isTomorrow && !isSelected) html += '<span class="tomorrow-label">可订</span>';
      html += '<div class="day-badge"></div>';
      html += '</div>';
    }

    $calGrid.innerHTML = html;
  }

  // ============ Render Date Info ============
  function renderDateInfo() {
    if(!selectedDate) {
      $dateInfoBar.innerHTML = '<span class="date-label">请选择日期</span>';
      return;
    }
    var dateOrders = allOrders.filter(function(o){ return o.date === selectedDate; });
    var guestCount = dateOrders.length;
    var revenue = 0;
    for(var i=0; i<dateOrders.length; i++) {
      revenue += calcOrderTotal(dateOrders[i].items || []);
    }
    var isRest = restDays.indexOf(selectedDate) !== -1;
    var isTomorrow = selectedDate === getTomorrowStr();
    var html = '<span class="date-label">📅 ' + fmtDate(selectedDate) + ' ' + getDayName(selectedDate);
    if(isRest) html += ' · 休息日';
    html += '</span>';
    if(isRest) {
      html += '<span class="guest-count" style="color:var(--danger)">今日休息</span>';
    } else if(isTomorrow) {
      if(guestCount > 0) {
        html += '<span class="guest-count" style="color:var(--success);border-color:var(--success)">✓ 可预订 · 已订 <strong>' + guestCount + '</strong> 位 · ¥' + revenue + '</span>';
      } else {
        html += '<span class="guest-count" style="color:var(--success);border-color:var(--success)">✓ 可预订</span>';
      }
    } else {
      if(guestCount > 0) {
        html += '<span class="guest-count">仅查看 · 已订 <strong>' + guestCount + '</strong> 位 · ¥' + revenue + '</span>';
      } else {
        html += '<span class="guest-count">仅查看</span>';
      }
    }
    $dateInfoBar.innerHTML = html;
  }

  // ============ Render Guest List ============
  function renderGuestList() {
    if(!selectedDate) {
      $guestListContainer.innerHTML = '<div class="empty-state"><span class="empty-icon">📋</span><p>请选择日期查看预订</p></div>';
      return;
    }
    var isRest = restDays.indexOf(selectedDate) !== -1;
    if(isRest) {
      $guestListContainer.innerHTML = '<div class="empty-state"><span class="empty-icon">😴</span><p>' + fmtDate(selectedDate) + ' 老板休息</p><p style="font-size:12px;margin-top:4px;opacity:0.6">该日期不接单</p></div>';
      return;
    }
    var dateOrders = allOrders.filter(function(o){ return o.date === selectedDate; });
    if(dateOrders.length === 0) {
      $guestListContainer.innerHTML = '<div class="empty-state"><span class="empty-icon">🍽️</span><p>' + fmtDate(selectedDate) + ' 暂无预订</p><p style="font-size:12px;margin-top:4px;opacity:0.6">快来成为第一位预订者吧！</p></div>';
      return;
    }

    dateOrders.sort(function(a,b){ return new Date(a.createdAt) - new Date(b.createdAt); });

    var html = '<table class="guest-table"><thead><tr>';
    html += '<th>#</th><th>姓名</th><th>预订菜品</th><th>合计</th><th>时间</th><th></th>';
    html += '</tr></thead><tbody>';

    for(var i=0; i<dateOrders.length; i++) {
      var order = dateOrders[i];
      var items = order.items || [];
      var total = calcOrderTotal(items);
      var timeStr = '';
      try {
        var dd = new Date(order.createdAt);
        timeStr = String(dd.getHours()).padStart(2,'0') + ':' + String(dd.getMinutes()).padStart(2,'0');
      } catch(e){}

      html += '<tr>';
      html += '<td class="col-num">' + (i+1) + '</td>';
      html += '<td class="col-name">' + escapeHTML(order.name) + '</td>';
      html += '<td class="col-items">';
      if(items.length === 0 && order.flavor) {
        html += '<span class="item-line">' + escapeHTML(order.flavor) + ' x' + escapeHTML(order.quantity||'1') + '</span>';
      } else {
        for(var j=0; j<items.length; j++) {
          html += '<span class="item-line">' + escapeHTML(items[j].name) + ' ×' + items[j].qty + '</span>';
        }
      }
      html += '</td>';
      html += '<td class="col-total">¥' + total + '</td>';
      html += '<td class="col-time">' + timeStr + '</td>';
      html += '<td><button class="btn-delete-row" onclick="window._deleteOrder(\'' + order.id + '\')">✕</button></td>';
      html += '</tr>';
    }

    var grandTotal = 0;
    for(var k=0; k<dateOrders.length; k++) {
      grandTotal += calcOrderTotal(dateOrders[k].items || []);
    }
    html += '<tr style="border-top:2px solid var(--border)"><td colspan="3" style="text-align:right;font-weight:700;color:var(--gold);font-size:14px;">当日总计 (' + dateOrders.length + '位)</td>';
    html += '<td class="col-total" style="font-size:18px;color:var(--gold);">¥' + grandTotal + '</td>';
    html += '<td colspan="2"></td></tr>';

    html += '</tbody></table>';
    $guestListContainer.innerHTML = html;
  }

  // ============ Render Summary ============
  function renderSummary() {
    var dateMap = {};
    for(var i=0; i<allOrders.length; i++) {
      var d = allOrders[i].date;
      if(!dateMap[d]) dateMap[d] = { count: 0, revenue: 0 };
      dateMap[d].count++;
      dateMap[d].revenue += calcOrderTotal(allOrders[i].items || []);
    }
    var dates = Object.keys(dateMap).sort();
    if(dates.length === 0) {
      $summaryGrid.innerHTML = '<div class="empty-state" style="padding:16px"><p style="font-size:13px">暂无预订记录</p></div>';
      return;
    }
    var html = '';
    for(var j=0; j<dates.length; j++) {
      var dd = dates[j];
      var isActive = selectedDate === dd;
      var isRest = restDays.indexOf(dd) !== -1;
      html += '<div class="summary-card' + (isActive?' active':'') + '" onclick="window._selectDate(\'' + dd + '\')">';
      html += '<div class="s-date">' + fmtDate(dd) + ' ' + getDayName(dd) + (isRest?' 休':'') + '</div>';
      html += '<div class="s-count">' + dateMap[dd].count + '</div>';
      html += '<div class="s-label">位预订</div>';
      html += '<div class="s-revenue">¥' + dateMap[dd].revenue + '</div>';
      html += '</div>';
    }
    $summaryGrid.innerHTML = html;
  }

  function updateTodayBadge() {
    var today = new Date();
    $todayBadge.textContent = '📅 ' + today.getFullYear() + '年' + (today.getMonth()+1) + '月' + today.getDate() + '日 ' + getDayName(getTodayStr());
  }

  function renderAll() {
    renderCalendar();
    renderDateInfo();
    renderGuestList();
    renderSummary();
    updateTodayBadge();
  }

  // ============ Actions ============
  function selectDate(dateStr) {
    if(bossMode) return;
    selectedDate = dateStr;
    // Jump calendar to the selected date's month
    var d = new Date(dateStr + 'T00:00:00');
    calYear = d.getFullYear();
    calMonth = d.getMonth();
    renderCalendar();
    renderDateInfo();
    renderGuestList();
    renderSummary();
  }

  function changeMonth(delta) {
    calMonth += delta;
    if(calMonth < 0) { calMonth = 11; calYear--; }
    if(calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  }

  function toggleBoss() {
    bossMode = !bossMode;
    if(bossMode) {
      $bossToggle.classList.add('on');
      $bossHint.classList.add('show');
      showToast('管理模式已开启','info');
    } else {
      $bossToggle.classList.remove('on');
      $bossHint.classList.remove('show');
      showToast('管理模式已关闭','info');
    }
    renderCalendar();
  }

  async function toggleRest(dateStr) {
    if(!bossMode) return;
    showLoading();
    try {
      if(restDays.indexOf(dateStr) !== -1) {
        await apiRemoveRestDay(dateStr);
        restDays = restDays.filter(function(d){ return d !== dateStr; });
        showToast(fmtDate(dateStr) + ' 已恢复接单','success');
      } else {
        await apiSetRestDay(dateStr);
        restDays.push(dateStr);
        restDays.sort();
        showToast(fmtDate(dateStr) + ' 已设为休息日','success');
        // If selected date was just set to rest, clear selection
        if(selectedDate === dateStr) selectedDate = null;
      }
      renderAll();
    } catch(err) {
      showToast('操作失败：' + (err.message||'请稍后重试'),'error');
    } finally {
      hideLoading();
    }
  }

  async function submitOrder(e) {
    e.preventDefault();
    if(!selectedDate) { showToast('请先选择预订日期','error'); return; }
    if(selectedDate !== getTomorrowStr()) { showToast('仅可预订次日（明天），请选择明天的日期','error'); return; }
    if(restDays.indexOf(selectedDate) !== -1) { showToast('该日期老板休息，不可预订','error'); return; }
    var name = document.getElementById('inputName').value.trim();
    var contact = document.getElementById('inputContact').value.trim();
    var notes = document.getElementById('inputNotes').value.trim();
    var items = getSelectedItems();

    if(!name || !contact) { showToast('请填写姓名和联系方式','error'); return; }
    if(items.length === 0) { showToast('请至少选择一样菜品','error'); return; }

    $btnSubmit.classList.add('loading');
    $btnSubmit.disabled = true;

    try {
      await apiAddOrder({
        date: selectedDate, name: name, contact: contact,
        items: items, notes: notes
      });
      showToast('预订成功！','success');
      $orderForm.reset();
      itemQuantities = {};
      renderItemPicker();
      updateTotal();
      await loadAll();
    } catch(err) {
      showToast('预订失败：' + (err.message||'请稍后重试'),'error');
    } finally {
      $btnSubmit.classList.remove('loading');
      $btnSubmit.disabled = false;
    }
  }

  async function deleteOrder(id) {
    if(!confirm('确定要删除这条预订吗？')) return;
    showLoading();
    try {
      await apiDeleteOrder(id);
      showToast('已删除','success');
      await loadAll();
    } catch(err) {
      showToast('删除失败','error');
    } finally { hideLoading(); }
  }

  // ============ Export ============
  function exportCSV() {
    if (allOrders.length === 0) { showToast('暂无数据可导出','error'); return; }
    var rows = [['日期','星期','姓名','联系方式','菜品明细','合计金额','备注','下单时间']];
    for (var i=0; i<allOrders.length; i++) {
      var o = allOrders[i];
      var items = (o.items||[]).map(function(it){ return it.name + 'x' + it.qty; }).join('、');
      var total = calcOrderTotal(o.items||[]);
      var timeStr = '';
      try { var d = new Date(o.createdAt); timeStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); } catch(e){}
      rows.push([o.date, getDayName(o.date), o.name, o.contact, items, total, o.notes||'', timeStr]);
    }
    var csv = '\uFEFF'; // BOM for Excel
    for (var r=0; r<rows.length; r++) {
      var line = rows[r].map(function(cell) {
        var s = String(cell);
        if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) {
          s = '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      }).join(',');
      csv += line + '\n';
    }
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '烤鱼预订_' + getTodayStr() + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('CSV已导出','success');
  }

  function exportJSON() {
    if (allOrders.length === 0) { showToast('暂无数据可导出','error'); return; }
    var data = { exportDate: getTodayStr(), orders: allOrders, restDays: restDays };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '烤鱼预订_' + getTodayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('JSON已导出','success');
  }

  // ============ Global ============
  window._selectDate = selectDate;
  window._deleteOrder = deleteOrder;
  window._changeQty = changeQty;
  window._changeMonth = changeMonth;
  window._toggleBoss = toggleBoss;
  window._toggleRest = toggleRest;
  window._exportCSV = exportCSV;
  window._exportJSON = exportJSON;

  $orderForm.addEventListener('submit', submitOrder);

  // ============ Init ============
  function init() {
    var now = new Date();
    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    calYear = tomorrow.getFullYear();
    calMonth = tomorrow.getMonth();
    renderWeekdays();
    renderMenuTable();
    renderItemPicker();
    updateTotal();
    updateTodayBadge();
    selectedDate = getTomorrowStr();

    if (!initGitHub()) {
      // GitHub not configured - still render UI but no data
      renderCalendar();
      renderDateInfo();
      renderGuestList();
      renderSummary();
      return;
    }

    loadAll();
    setInterval(loadAll, 60000);
  }
  init();
})();
</script>

</body></html>
